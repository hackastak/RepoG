name: CI
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Install dependencies
        run: sudo apt-get install -y gcc libsqlite3-dev
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          # Pinned so a new linter release can't fail CI on an unrelated PR. Bump
          # deliberately, keeping it in step with the version contributors run locally.
          version: v2.11.3

  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        go: ['1.25']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y gcc libsqlite3-dev
      - name: Build
        run: go build ./...
      - name: Test
        run: |
          # Test all packages with -race, but only collect coverage from packages with tests
          # This avoids the covdata error on macOS for packages without test files
          go test -race ./...
          # Collect coverage separately from packages with tests only
          go test -coverprofile=coverage.out ./commands ./internal/ask ./internal/config ./internal/db \
            ./internal/embed ./internal/format ./internal/github ./internal/provider \
            ./internal/recommend ./internal/search ./internal/status ./internal/summarize \
            ./internal/sync ./internal/tui
      - name: Coverage check
        run: |
          # Floor, not a target. Every package with tests is measured, including the
          # thinly-covered `commands` package, so this number is lower than a curated
          # subset would report. Target is 80% — tracked in ROADMAP.md.
          go tool cover -func=coverage.out | grep total | \
          awk '{gsub(/%/,"",$3); if ($3 < 45) {print "Coverage below 45%: " $3"%"; exit 1}}'

  release:
    name: Release
    needs: [lint, test]
    runs-on: macos-latest
    if: startsWith(github.ref, 'refs/tags/v') && !failure() && !cancelled()
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Extract release notes from CHANGELOG
        # Slice the section for this tag out of CHANGELOG.md so the GitHub release
        # body is the hand-written changelog, not GoReleaser's raw commit list. The
        # awk prints the lines between this version's `## [x.y.z]` header and the
        # next `## [` header. If the section is empty (missing entry), we leave the
        # file absent so GoReleaser falls back to its generated changelog.
        run: |
          version="${GITHUB_REF_NAME#v}"
          # macOS/BSD-awk compatible (the release job runs on macos-latest): print
          # the body between this version's header and the next section, dropping
          # the blank line that follows the header.
          awk -v ver="$version" '
            $0 ~ "^## \\[" ver "\\]" { flag=1; next }
            flag && /^## \[/ { exit }
            flag {
              if (!started && $0 ~ /^[[:space:]]*$/) next
              started=1
              print
            }
          ' CHANGELOG.md > release-notes.md
          if [ -s release-notes.md ]; then
            echo "RELEASE_NOTES_ARGS=--release-notes=release-notes.md" >> "$GITHUB_ENV"
            echo "Extracted $(wc -l < release-notes.md) lines of release notes for $version"
          else
            echo "No CHANGELOG section for $version; using GoReleaser's generated changelog"
          fi
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: release --clean ${{ env.RELEASE_NOTES_ARGS }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
